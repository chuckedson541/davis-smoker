name: Build Android app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check every file arrived intact
        shell: bash
        run: |
          set -o pipefail
          sha256sum -c checksums.sha256 2>&1 | tee build.log

      - name: Signing key (made once, then reused so updates install over the old app)
        shell: bash
        run: |
          if [ ! -f app/davis-smoker.jks.b64 ]; then
            keytool -genkeypair -keystore app/davis-smoker.jks -alias davis -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass davis-smoker-2026 -keypass davis-smoker-2026 -dname "CN=Davis Smoker, O=Edson Family, L=Eugene, ST=Oregon, C=US"
            base64 -w 76 app/davis-smoker.jks > app/davis-smoker.jks.b64
            git config user.name "build bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/davis-smoker.jks.b64
            git commit -m "Save the app signing key [skip ci]"
            git push origin HEAD:main
          else
            base64 -d app/davis-smoker.jks.b64 > app/davis-smoker.jks
          fi

      - name: Build the APK
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save the build log if it failed
        if: failure()
        shell: bash
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "build bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          tail -c 60000 build.log > last.log
          git add last.log
          git commit -m "Build ${{ github.run_number }} failed"
          git push -f origin build-logs

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk DavisSmoker-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DavisSmoker-${{ github.run_number }}
          path: DavisSmoker-${{ github.run_number }}.apk

      - name: Put it on the Releases page for phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Davis Smoker build ${{ github.run_number }}
          body: Download the .apk below on your Android phone and open it to install or update.
          files: DavisSmoker-${{ github.run_number }}.apk
